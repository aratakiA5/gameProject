<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星界遠征録 - Corner Idle RPG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="desktop-space">
    <section class="intro">
      <p class="eyebrow">CORNER IDLE RPG</p>
      <h1>星界遠征録</h1>
      <p>作業中も画面右下で遠征隊が戦い続けます。小窓を展開すると編成・育成・戦闘ログを確認できます。</p>
      <div class="hint">右下の戦闘ウィンドウを見てください ↓</div>
    </section>
  </main>

  <section id="gameWindow" class="game-window">
    <header class="mini-header">
      <div>
        <strong>星界遠征録</strong>
        <span id="areaLabel">星屑の回廊</span>
      </div>
      <div class="header-actions">
        <span class="auto-dot"></span><span>AUTO</span>
        <button id="pauseBtn" class="icon-btn" title="一時停止">Ⅱ</button>
        <button id="expandBtn" class="icon-btn" title="展開">▲</button>
      </div>
    </header>

    <div class="resource-strip">
      <span>◆ <b id="crystal">120</b></span>
      <span>Pt <b id="expedition">0</b></span>
      <span>WAVE <b id="waveLabel">1 / 10</b></span>
    </div>

    <div class="battlefield">
      <div id="partyField" class="party-field"></div>
      <div class="vs-line"></div>
      <div id="enemyField" class="enemy-field"></div>
      <div id="floatText" class="float-text"></div>
    </div>

    <div class="mini-status">
      <div><span id="enemyName">星蝕ウルフ</span><b id="enemyHpText"></b></div>
      <div class="hp-track enemy-track"><i id="enemyHpBar"></i></div>
    </div>

    <div id="expandedPanel" class="expanded-panel">
      <div class="tabs">
        <button class="tab active" data-tab="party">編成</button>
        <button class="tab" data-tab="train">育成</button>
        <button class="tab" data-tab="log">ログ</button>
      </div>

      <div id="partyTab" class="tab-content active">
        <p class="panel-note">4人まで編成できます。変更は次の戦闘から反映されます。</p>
        <div id="roster" class="roster"></div>
      </div>

      <div id="trainTab" class="tab-content">
        <div id="trainList" class="train-list"></div>
      </div>

      <div id="logTab" class="tab-content">
        <div id="battleLog" class="battle-log"></div>
      </div>
    </div>

    <footer class="mini-footer">
      <span id="statusText">遠征中...</span>
      <button id="resetBtn" class="text-btn">SAVE RESET</button>
    </footer>
  </section>

  <script src="game.js"></script>
</body>
</html>
